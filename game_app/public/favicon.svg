<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e183a" />
      <stop offset="100%" stop-color="#0a0814" />
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="50%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#f72585" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a7" />
      <stop offset="100%" stop-color="#e2b042" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Outer Ring / Orbit -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="#7209b7" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.8" />

  <!-- Center Mneme Crystal Diamond -->
  <polygon points="50,15 68,50 50,85 32,50" fill="url(#crystalGrad)" filter="url(#glow)" />
  <polygon points="50,15 50,85 68,50" fill="#ffffff" opacity="0.2" />

  <!-- Glowing Core Particle -->
  <circle cx="50" cy="50" r="6" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Floating Sparkles -->
  <circle cx="30" cy="30" r="2" fill="#ffe6a7" />
  <circle cx="70" cy="32" r="1.5" fill="#4cc9f0" />
  <circle cx="68" cy="68" r="2" fill="#f72585" />
  <circle cx="28" cy="66" r="1.5" fill="#ffe6a7" />
</svg>
